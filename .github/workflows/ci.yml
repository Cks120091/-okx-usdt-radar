name: OKX MA MACD Radar CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate responsive dashboard JavaScript
        run: node scripts/check_macd_dashboard.cjs
      - name: Compile MA MACD server
        run: python -m compileall -q macd_radar run.py
      - name: MACD and MA/divergence offline tests
        run: python -m unittest discover -s macd_radar/tests -p 'test_*.py' -v
      - name: Confirm production entrypoint imports only new radar
        run: python -c "import run; import macd_radar.app; assert run.main is macd_radar.app.main"
      - name: Verify formatting
        run: git diff --check
