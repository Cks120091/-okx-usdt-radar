name: Solana Paper Only CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile new runtime
        run: python -m compileall -q solana_paper run.py
      - name: Offline paper engine tests
        run: python -m unittest discover -s solana_paper/tests -p 'test_*.py' -v
      - name: Offline paper accounting tests
        run: python -m unittest discover -s tests -p 'test_solana_paper.py' -v
      - name: Verify formatting
        run: git diff --check
