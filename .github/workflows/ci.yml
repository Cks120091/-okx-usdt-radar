name: OKX Radar V3.3 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-v3-3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile source
        run: python -m compileall -q radar run.py scripts tests

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Verify clean patch formatting
        run: git diff --check
