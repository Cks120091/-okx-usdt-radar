name: Solana Six Agent Paper CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Solana system
        run: python -m compileall -q solana_paper
      - name: Test paper simulator
        run: python -m unittest discover -s solana_paper/tests -v
      - name: Diff check
        run: git diff --check
