name: Patch single-history cache key tests

on:
  push:
    branches: [feat/history-all-actionable-15m-20260911]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply single-coin cache-key fixture patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/history-all-actionable-15m-20260911
      - name: Update only the two stale PWA cache-key assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_v2_contract.py')
          text = path.read_text(encoding='utf-8')
          old = 'okx-radar-shell-v4.5-history-replay-1'
          new = 'okx-radar-shell-v4.6-single-coin-history-1'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 stale cache-key assertions, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name "Cks120091"
          git config user.email "k7v4srb5rc@privaterelay.appleid.com"
          git add tests/test_v2_contract.py
          git commit -m "Apply single-coin cache-key fixture patch"
          git push origin HEAD:feat/history-all-actionable-15m-20260911
