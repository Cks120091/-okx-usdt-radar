name: Patch and validate preflight history rate

on:
  push:
    branches: [preflight-history-rate]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message != 'Apply preflight history-rate integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preflight-history-rate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic patch
        run: |
          python scripts/apply_preflight_history_rate_patch.py
          git diff --check
          node --check radar/static/history-replay.js
          node --check radar/static/history-scan.js
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Run regressions
        run: |
          python -m compileall -q radar scripts tests run.py
          python -m unittest discover -s tests -q
          python scripts/check_history_replay_ui.py
          python scripts/check_card_statistics_ui.py
          python scripts/check_quicklook_ui.py
          git diff --check
      - name: Commit tested changes
        run: |
          git config user.name "Cks120091"
          git config user.email "k7v4srb5rc@privaterelay.appleid.com"
          git add radar/static/pages.html radar/static/history-replay.js radar/static/service-worker.js tests/test_v2_contract.py scripts/check_history_replay_ui.py
          git commit -m "Apply preflight history-rate integration"
          git push origin HEAD:preflight-history-rate
