name: Review history scan card integration
on:
  push:
    branches: [feat/history-scan-cards-20260911]
permissions:
  contents: read
concurrency:
  group: history-cards-review
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked source for isolated integration tests
        run: git archive --format=zip --output=/tmp/history-cards-source.zip HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: history-cards-source
          path: /tmp/history-cards-source.zip
          retention-days: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Baseline regressions
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q radar tests scripts run.py
          python -m unittest discover -s tests -q
          git diff --check
