name: Validate history sample tiers
on:
  push:
    branches: [feat/history-sample-tiers-20260911]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Validate
        run: |
          python -m compileall -q radar scripts tests run.py
          python -m unittest discover -s tests -q
          python scripts/check_history_replay_ui.py
          python scripts/check_history_sample_tiers_ui.py
          python scripts/check_card_statistics_ui.py
          python scripts/check_quicklook_ui.py
          node --check radar/static/history-replay.js
          node --check radar/static/history-scan.js
          git diff --check
