name: Validate single-coin 15m history

on:
  push:
    branches: [feat/history-all-actionable-15m-20260911]

permissions:
  contents: read

concurrency:
  group: history-single-15m-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate backend and syntax
        run: |
          python -m compileall -q radar scripts tests run.py
          python -m unittest discover -s tests -q
          node --check radar/static/history-replay.js
          node --check radar/static/history-scan.js
          git diff --check
