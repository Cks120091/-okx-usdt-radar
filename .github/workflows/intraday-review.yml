name: Intraday isolated review
on:
  push:
    branches: [fix/intraday-mtf-flow-20260909]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prepare offline review bundle
        run: |
          mkdir -p review-bundle/wheels
          git archive --format=zip --output=review-bundle/radar-source.zip HEAD
          python -m pip wheel -r requirements.txt -w review-bundle/wheels || true
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          try:
              req = urllib.request.Request('https://www.okx.com/docs-v5/en/', headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as response:
                  Path('review-bundle/okx-official-api.html').write_bytes(response.read(12000000))
          except Exception as exc:
              Path('review-bundle/api-docs-error.txt').write_text(str(exc))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: radar-review-source
          path: review-bundle/
          retention-days: 1
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
