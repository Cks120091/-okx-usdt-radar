name: Intraday isolated review
on:
  push:
    branches: [fix/intraday-mtf-flow-20260909]
    paths: ['.github/workflows/intraday-review.yml']
permissions:
  contents: write
concurrency:
  group: intraday-isolated-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply checksum-verified local patch
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.github/intraday-patch-{i}.b64').read_text().strip() for i in range(3))
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = '180373fff4a76328811cad8288505500e9acd2e59bc796b886777f79b1ce0ee6'
          assert hashlib.sha256(raw).hexdigest() == expected, 'Patch checksum mismatch'
          patch = Path('/tmp/intraday-update.patch'); patch.write_bytes(raw)
          check = subprocess.run(['git','apply','--check','--unidiff-zero',str(patch)])
          if check.returncode:
              subprocess.run(['git','apply','--reverse','--check','--unidiff-zero',str(patch)],check=True)
          else:
              subprocess.run(['git','apply','--unidiff-zero',str(patch)],check=True)
          print('Patch checksum and application verified')
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt playwright
      - name: Python regression suite
        run: |
          python -m compileall -q radar run.py scripts tests
          python -m unittest discover -s tests -v
          git diff --check
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('radar/static/pages.html').read_text()
          Path('/tmp/radar-ui.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)))
          PY
          node --check /tmp/radar-ui.js
      - name: Browser availability
        run: |
          if ! command -v google-chrome && ! command -v chromium; then
            python -m playwright install --with-deps chromium
          fi
      - name: Mobile and desktop single-coin UI
        run: python scripts/check_intraday_ui.py
      - name: Commit verified implementation to review branch only
        run: |
          test "${GITHUB_REF_NAME}" = 'fix/intraday-mtf-flow-20260909'
          git add README.md radar/api.py radar/intraday_flow.py radar/market_story.py radar/repository.py radar/scanner.py radar/service.py radar/static/pages.html radar/static/service-worker.js scripts/check_intraday_ui.py tests/test_intraday_flow.py tests/test_scanner.py tests/test_v2_contract.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Support intraday opposite-price episodes and aligned single-coin OI/CVD'
            git push origin HEAD:fix/intraday-mtf-flow-20260909
          fi
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Export tested source and hash manifest
        run: |
          mkdir -p review-result
          git archive --format=zip --output=review-result/tested-source.zip HEAD
          git rev-parse HEAD > review-result/commit.txt
          git ls-files -s > review-result/git-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tested-intraday-implementation
          path: review-result/
          retention-days: 3
