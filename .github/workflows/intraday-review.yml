name: Intraday isolated review
on:
  push:
    branches: [fix/intraday-mtf-flow-20260909]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Export tracked source only
        run: git archive --format=zip --output=radar-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: radar-review-source
          path: radar-source.zip
          retention-days: 1
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
