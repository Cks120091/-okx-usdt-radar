name: Intraday review branch validation

on:
  push:
    branches: [agent/intraday-flow-20260909]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intraday-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Export source for independent review
        run: git archive --format=zip HEAD -o /tmp/radar-source.zip
      - name: Upload review source
        uses: actions/upload-artifact@v4
        with:
          name: radar-review-source
          path: /tmp/radar-source.zip
          retention-days: 3
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q radar run.py scripts tests
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
