name: Entry position audit (repair branch only)
on:
  push:
    branches: [repair/entry-position-advisory-20260920]
permissions:
  contents: write
concurrency:
  group: entry-position-repair
  cancel-in-progress: true
jobs:
  audit:
    if: github.ref == 'refs/heads/repair/entry-position-advisory-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Inspect actual integration boundaries
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          requests = {
              'radar/_decision_core.py': {'_plan_present','_terminal_invalidation','_target_completed','_direction'},
              'radar/scanner.py': {'_attach_decision','_refresh_entry_eligibility'},
              'radar/service.py': {'_canonical_single_decision','_merge_preflight_confirmation','_latest_trigger_confirmation'},
              'radar/public_payload.py': {'public_decision_context','_decision_context'},
          }
          for path, wanted in requests.items():
              text = Path(path).read_text()
              tree = ast.parse(text)
              print('\nSOURCE', path)
              print('FUNCTIONS', ', '.join(f'{n.name}:{n.lineno}' for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef,ast.AsyncFunctionDef)) and ('decision' in n.name or 'confirmation' in n.name or 'payload' in n.name)))
              for n in ast.walk(tree):
                  if isinstance(n, ast.FunctionDef) and n.name in wanted:
                      print('\nBEGIN',path,n.name)
                      print('\n'.join(text.splitlines()[n.lineno-1:n.end_lineno]))
                      print('END',n.name)
          PY
      - name: Apply reviewed deterministic patch when present
        run: |
          if [ -f .maintenance/entry_position_patch.py ]; then python .maintenance/entry_position_patch.py; fi
      - name: Compile all Python
        run: python -m compileall -q radar run.py scripts tests
      - name: Full offline regression tests
        run: |
          python - <<'PY'
          import io, unittest
          unittest.TestCase.maxDiff=1400
          suite=unittest.defaultTestLoader.discover('tests')
          stream=io.StringIO()
          result=unittest.TextTestRunner(stream=stream,verbosity=1).run(suite)
          print('TESTS_RUN',result.testsRun,'FAILURES',len(result.failures),'ERRORS',len(result.errors),'SKIPPED',len(result.skipped))
          for test,detail in result.failures+result.errors:
              print('\nCASE',test)
              print(detail[:5500])
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Frontend behavioral tests
        run: |
          if [ -f scripts/check_entry_position_ui.js ]; then node scripts/check_entry_position_ui.js; fi
          git diff --check
      - name: Publish tested changes to repair branch only
        run: |
          if [ -f .maintenance/entry_position_patch.py ] && ! git diff --quiet; then
            git config user.name 'Cks120091'
            git config user.email '315490352+Cks120091@users.noreply.github.com'
            git add radar tests scripts docs
            git commit -m 'fix: separate signal validity from entry-position advice'
            git push origin HEAD:refs/heads/repair/entry-position-advisory-20260920
            git rev-parse HEAD
          fi
