name: Entry position audit (repair branch only)
on:
  push:
    branches: [repair/entry-position-advisory-20260920]
permissions:
  contents: write
concurrency:
  group: entry-position-repair
  cancel-in-progress: true
jobs:
  audit:
    if: github.ref == 'refs/heads/repair/entry-position-advisory-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply reviewed deterministic patch
        run: |
          python .maintenance/entry_position_patch.py
          if [ -f .maintenance/entry_position_refine.py ]; then python .maintenance/entry_position_refine.py; fi
      - name: Compile all Python
        run: python -m compileall -q radar run.py scripts tests
      - name: Full offline regression tests
        run: |
          python - <<'PY'
          import io, unittest, inspect, os
          from pathlib import Path
          unittest.TestCase.maxDiff=1000
          suite=unittest.defaultTestLoader.discover('tests')
          result=unittest.TextTestRunner(stream=io.StringIO(),verbosity=1).run(suite)
          summary=f"SHA {os.environ['GITHUB_SHA']}\nTESTS_RUN {result.testsRun} FAILURES {len(result.failures)} ERRORS {len(result.errors)} SKIPPED {len(result.skipped)}\n"
          report=[summary]; sources=[]
          for test,detail in result.failures+result.errors:
              report.extend([str(test),detail[:2200]])
              source_test=getattr(test,'test_case',None) or getattr(test,'_test_case',None) or test
              try:
                  method=getattr(source_test,source_test._testMethodName)
                  lines,first=inspect.getsourcelines(method)
                  sources.append(f"\nCASE {test}\nSOURCE {inspect.getsourcefile(method)}:{first}\n"+''.join(lines))
              except Exception as exc:
                  sources.append(str(exc))
          Path('.maintenance/audit_report.txt').write_text('\n'.join(report))
          Path('.maintenance/audit_cases.txt').write_text('\n'.join(sources))
          print(summary)
          for line in report[1:]: print(line[:300])
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Frontend behavioral tests
        run: |
          if [ -f scripts/check_entry_position_ui.js ]; then node scripts/check_entry_position_ui.js; fi
          git diff --check
      - name: Publish tested changes to repair branch only
        run: |
          git config user.name 'Cks120091'
          git config user.email '315490352+Cks120091@users.noreply.github.com'
          git add radar tests scripts docs
          if ! git diff --cached --quiet; then git commit -m 'fix: separate signal validity from entry-position advice'; fi
          git add .maintenance/audit_report.txt .maintenance/audit_cases.txt
          if ! git diff --cached --quiet; then git commit -m 'Record successful isolated regression report'; fi
          git push origin HEAD:refs/heads/repair/entry-position-advisory-20260920
          git rev-parse HEAD
      - name: Save failed-test report only (never publish failed code)
        if: failure()
        run: |
          if [ -f .maintenance/audit_report.txt ]; then
            git config user.name 'Cks120091'
            git config user.email '315490352+Cks120091@users.noreply.github.com'
            git add .maintenance/audit_report.txt .maintenance/audit_cases.txt
            if ! git diff --cached --quiet; then
              git commit -m 'Record isolated regression diagnostics'
              git push origin HEAD:refs/heads/repair/entry-position-advisory-20260920
            fi
          fi
      - name: Export source snapshot (no credentials or git metadata)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entry-position-source-audit
          retention-days: 1
          path: |
            radar/
            tests/
            scripts/
            docs/
            run.py
            requirements.txt
            config.example.json
