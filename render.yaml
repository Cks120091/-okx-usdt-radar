services:
  - type: web
    name: okx-radar-v2-live
    runtime: docker
    plan: free
    region: singapore
    branch: main
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: RADAR_RELEASE
        value: radar-continuation-advisory-only-20260903
