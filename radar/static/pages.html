<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>OKX 雷達 V2</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#07111f;--panel:#0d1a2b;--panel2:#122238;--line:#263a54;
      --text:#f4f7fb;--muted:#9fb0c5;--green:#2bd98f;--red:#ff6475;
      --orange:#ffb84d;--blue:#62a8ff;--yellow:#f6d365;--gray:#8291a5;
      --shadow:0 12px 34px rgba(0,0,0,.24)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    body{padding:0 0 calc(96px + env(safe-area-inset-bottom));overflow-x:hidden}
    button,summary{font:inherit}
    button{touch-action:manipulation}
    .shell{width:min(100%,980px);margin:0 auto;padding:16px}
    .top{position:sticky;top:0;z-index:20;margin:-16px -16px 14px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:rgba(7,17,31,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(68,91,120,.45)}
    .brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand h1{font-size:20px;line-height:1.2;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
    .status-pill,.badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;border:1px solid transparent;white-space:nowrap}
    .status-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
    .fresh{color:var(--green);background:rgba(43,217,143,.10);border-color:rgba(43,217,143,.32)}
    .scanning,.booting{color:var(--blue);background:rgba(98,168,255,.10);border-color:rgba(98,168,255,.32)}
    .scanning::before,.booting::before{animation:pulse 1.1s infinite}
    .stale,.error{color:var(--red);background:rgba(255,100,117,.11);border-color:rgba(255,100,117,.34)}
    @keyframes pulse{50%{opacity:.28;transform:scale(.78)}}
    .summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
    .metric{min-width:0;background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:var(--shadow)}
    .metric .k{color:var(--muted);font-size:11px;margin-bottom:5px}.metric .v{font-size:19px;font-weight:850;overflow-wrap:anywhere}.metric.wide{grid-column:1/-1}.metric.wide .v{font-size:14px}
    .notice{display:none;border-radius:15px;padding:13px 14px;margin:0 0 12px;font-size:14px;font-weight:700;line-height:1.55;border:1px solid}
    .notice.show{display:block}.notice.scan{color:#d9ebff;background:#0c2949;border-color:#295d91}.notice.danger{color:#ffe5e8;background:#39151e;border-color:#7a2b3b}
    .progress{height:7px;margin-top:10px;border-radius:999px;background:#081422;overflow:hidden}.progress>i{display:block;height:100%;width:18%;background:linear-gradient(90deg,var(--blue),var(--yellow));border-radius:inherit;transition:width .25s}.progress.indeterminate>i{animation:slide 1.3s infinite;width:35%}@keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(310%)}}
    .tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{min-height:42px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px;padding:9px 13px;font-weight:750;white-space:nowrap}.tab.active{color:#fff;border-color:#426e9f;background:#16304e}
    .section{display:none}.section.active{display:block}.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:11px 2px}.section-title h2{font-size:17px;margin:0}.section-title span{font-size:12px;color:var(--muted)}
    .empty{border:1px dashed #38506d;background:rgba(15,31,51,.62);border-radius:16px;padding:28px 18px;text-align:center;color:var(--muted);line-height:1.6}
    .signal-card,.watch-card,.map-card{background:linear-gradient(155deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:15px;margin:0 0 12px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
    .signal-card.long{border-left:4px solid var(--green)}.signal-card.short{border-left:4px solid var(--red)}
    .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.symbol{font-size:17px;font-weight:900;overflow-wrap:anywhere}.score{font-size:24px;font-weight:900;white-space:nowrap}.score small{font-size:11px;color:var(--muted)}
    .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.badge{padding:5px 9px;font-size:11px}.long-b{color:var(--green);background:rgba(43,217,143,.10);border-color:rgba(43,217,143,.34)}.short-b{color:var(--red);background:rgba(255,100,117,.10);border-color:rgba(255,100,117,.34)}.early-b{color:var(--orange);background:rgba(255,184,77,.11);border-color:rgba(255,184,77,.36)}.confirmed-long{color:#031b11;background:var(--green);border-color:var(--green)}.confirmed-short{color:#26030a;background:var(--red);border-color:var(--red)}.near-b{color:var(--yellow);background:rgba(246,211,101,.10);border-color:rgba(246,211,101,.34)}.watch-b{color:#d5dbe4;background:rgba(130,145,165,.13);border-color:rgba(130,145,165,.35)}
    .tf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.tf{background:#081625;border:1px solid #203a57;border-radius:12px;padding:9px;min-width:0}.tf b{display:block;font-size:11px;color:var(--blue);margin-bottom:4px}.tf span{font-size:12px;font-weight:750;line-height:1.35;overflow-wrap:anywhere}
    .human{background:#0a1727;border-left:3px solid var(--blue);border-radius:9px;padding:11px 12px;line-height:1.6;font-size:13px;color:#dbe8f6;margin:10px 0 13px}
    .groups{display:grid;gap:8px}.group-row{display:grid;grid-template-columns:92px 1fr 38px;gap:8px;align-items:center;font-size:12px}.bar{height:8px;background:#08131f;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;border-radius:inherit;background:var(--blue)}.bar i.support{background:var(--green)}.bar i.conflict{background:var(--red)}
    .triage{display:grid;gap:9px;margin-top:14px}.bucket{border-radius:12px;padding:10px 11px;background:#091726;border:1px solid #20344e}.bucket h3{font-size:12px;margin:0 0 7px}.bucket h4{font-size:11px;color:var(--gray);margin:9px 0 5px;border-top:1px solid #20344e;padding-top:7px}.bucket ul{margin:0;padding-left:18px;color:#d2deeb;font-size:12px;line-height:1.55}.bucket ul.neutral{color:var(--gray)}.bucket.support h3{color:var(--green)}.bucket.conflict h3{color:var(--orange)}.bucket.safety h3{color:var(--blue)}
    details{border-top:1px solid var(--line);margin-top:13px;padding-top:3px}summary{min-height:44px;display:flex;align-items:center;color:#cbd8e7;font-weight:800;font-size:13px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:"＋";margin-left:auto;color:var(--blue);font-size:18px}details[open] summary::after{content:"－"}.detail-grid{display:grid;grid-template-columns:1fr;gap:8px;padding:3px 0 8px}.detail{background:#081522;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.detail b{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.raw{white-space:pre-wrap;word-break:break-word;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#bfd0e3;margin:0}
    .watch-card .card-head,.map-card{font-size:13px}.watch-card .human{margin-bottom:0}.map-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:12px}.map-meta{color:var(--muted);font-size:11px;margin-top:4px}.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:#fff;padding:10px 12px;font-size:16px;margin-bottom:10px}
    .action-wrap{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(7,17,31,0),rgba(7,17,31,.96) 25%)}.action{display:block;width:min(100%,680px);min-height:54px;margin:0 auto;border:0;border-radius:16px;background:linear-gradient(135deg,#2e7de0,#4ca9ff);color:#fff;font-weight:900;font-size:16px;box-shadow:0 10px 28px rgba(38,126,224,.38)}.action:disabled{background:#29435f;color:#9eb3c8;box-shadow:none}.foot{color:var(--muted);font-size:11px;line-height:1.6;text-align:center;margin:22px 8px 0}
    @media(min-width:720px){.summary{grid-template-columns:repeat(4,minmax(0,1fr))}.metric.wide{grid-column:span 2}.tf-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.triage{grid-template-columns:repeat(3,minmax(0,1fr))}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:22px}.top{margin:-22px -22px 16px;padding-left:22px;padding-right:22px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand">
        <div><h1>OKX 雷達 V2</h1><small>公開市場資料 · 只分析、不下單</small></div>
        <span id="statusPill" class="status-pill booting">雷達啟動中</span>
      </div>
    </header>

    <section class="summary" aria-label="雷達總覽">
      <div class="metric wide"><div class="k">最後更新（台灣時間）</div><div class="v" id="updatedAt">正在喚醒服務…</div></div>
      <div class="metric"><div class="k">正式進場訊號</div><div class="v" id="signalCount">— / 20</div></div>
      <div class="metric"><div class="k">接近觸發</div><div class="v" id="nearCount">—</div></div>
      <div class="metric"><div class="k">市場方向</div><div class="v" id="marketBias">—</div></div>
      <div class="metric"><div class="k">深度資料覆蓋</div><div class="v" id="contextCount">—</div></div>
    </section>

    <div id="scanNotice" class="notice scan" role="status">
      <div id="scanMessage">正在掃描 OKX 最新市場</div>
      <div id="scanProgress" class="progress indeterminate"><i></i></div>
    </div>
    <div id="dangerNotice" class="notice danger" role="alert"></div>

    <nav class="tabs" aria-label="雷達內容">
      <button class="tab active" data-tab="signals">進場訊號</button>
      <button class="tab" data-tab="watchlist">接近觸發</button>
      <button class="tab" data-tab="map">市場地圖</button>
    </nav>

    <section id="signals" class="section active">
      <div class="section-title"><h2>正式進場訊號</h2><span>最多 20 個，不為湊數降標</span></div>
      <div id="signalsBox"><div class="empty">雷達啟動中，正在準備最新市場掃描。</div></div>
    </section>
    <section id="watchlist" class="section">
      <div class="section-title"><h2>接近觸發</h2><span>不是目前進場訊號</span></div>
      <div id="watchBox"><div class="empty">等待最新掃描。</div></div>
    </section>
    <section id="map" class="section">
      <div class="section-title"><h2>市場地圖</h2><span>全 live USDT 永續</span></div>
      <input id="mapSearch" class="search" type="search" placeholder="搜尋幣種，例如 BTC" autocomplete="off">
      <div id="mapBox"><div class="empty">等待最新掃描。</div></div>
    </section>

    <p class="foot">分析用途，不保證獲利。沒有接入 OKX 私人 API，也不會自動下單、開倉或平倉。</p>
  </main>

  <div class="action-wrap"><button id="scanButton" class="action" type="button">立即掃描現在市場</button></div>

  <script>
    const $=selector=>document.querySelector(selector);
    const $$=selector=>[...document.querySelectorAll(selector)];
    const state={status:null,report:null,polling:false,autoStarted:false};
    const directionName={LONG:'做多',SHORT:'做空',NEUTRAL:'中性'};
    const stageName={WATCH:'觀望',NEAR_TRIGGER:'接近觸發',EARLY:'早期訊號',EARLY_SIGNAL:'早期訊號',CONFIRMED:'完整確認'};
    const regimeName={TREND:'趨勢',BREAKOUT_READY:'突破準備',BREAKOUT:'突破準備',RANGE:'區間震盪',DISORDER:'混亂／等待'};
    const statusName={BOOTING:'雷達啟動中',SCANNING:'掃描中',FRESH:'資料最新',STALE:'資料過期',ERROR:'掃描異常'};

    function esc(value){return String(value??'—').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
    function num(value,digits=1){const n=Number(value);return Number.isFinite(n)?n.toLocaleString('zh-TW',{maximumFractionDigits:digits}):'—'}
    function taiwanTime(value){if(!value)return '尚未完成掃描';const d=new Date(value);return Number.isNaN(d.getTime())?'時間未知':new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)}
    async function api(path,options={}){const response=await fetch(path,{cache:'no-store',headers:{'Accept':'application/json',...(options.headers||{})},...options});let payload={};try{payload=await response.json()}catch(_){payload={error:'服務回應格式錯誤'}}if(!response.ok)throw Object.assign(new Error(payload.error||`HTTP ${response.status}`),{status:response.status,payload});return payload}

    function renderStatus(status){
      state.status=status;const key=status.system_status||status.runtime_status||'BOOTING';
      const pill=$('#statusPill');pill.textContent=statusName[key]||'雷達啟動中';pill.className=`status-pill ${String(key).toLowerCase()}`;
      const scanning=key==='SCANNING';$('#scanButton').disabled=scanning;$('#scanButton').textContent=scanning?'掃描中…':'立即掃描現在市場';
      const notice=$('#scanNotice');notice.classList.toggle('show',scanning||key==='BOOTING');
      if(scanning){const p=status.progress||{};$('#scanMessage').textContent=p.message||'正在取得最新市場資料';const bar=$('#scanProgress');const has=Number.isFinite(Number(p.percent));bar.classList.toggle('indeterminate',!has);bar.querySelector('i').style.width=has?`${Math.max(3,Math.min(100,Number(p.percent)))}%`:'35%'}
      const danger=$('#dangerNotice');let warning='';
      if(key==='STALE'||status.data_status==='STALE')warning=`資料已超過 30 分鐘，禁止依此進場。請立即重新掃描。${status.last_error?' 最新掃描失敗：'+status.last_error:''}`;
      if(key==='ERROR')warning=`最新掃描失敗，舊正式訊號已停用。${status.last_error?' '+status.last_error:''}`;
      danger.textContent=warning;danger.classList.toggle('show',Boolean(warning));
      if(scanning||key==='BOOTING'){renderUnavailable(scanning?'正在掃描最新市場，舊正式訊號已暫停使用。':'雷達啟動中，正在準備最新市場。')}
      else if(key==='STALE'){renderUnavailable('資料已過期，禁止依此進場。')}
      else if(key==='ERROR'){renderUnavailable('最新掃描異常，目前沒有可使用的正式訊號。')}
    }

    function renderUnavailable(message){
      $('#signalsBox').innerHTML=`<div class="empty">${esc(message)}</div>`;
      $('#signalCount').textContent='— / 20';
    }

    function renderReport(report){
      state.report=report;const actionable=report.actionable===true&&report.runtime_status==='FRESH';
      $('#updatedAt').textContent=taiwanTime(report.completed_at||report.generated_at);
      $('#signalCount').textContent=`${actionable?(report.signals||[]).length:0} / ${num(report.max_signals||20,0)}`;
      $('#nearCount').textContent=num((report.watchlist||[]).filter(x=>x.status==='NEAR_TRIGGER').length,0);
      const bias=report.market_bias||{};$('#marketBias').textContent=`${esc(bias.label||'中性')} ${num(bias.score,0)}`;
      $('#contextCount').textContent=`${num(report.context_enriched_count,0)} / ${num(report.context_target_count,0)}`;
      if(!actionable){renderUnavailable(report.runtime_status==='SCANNING'?'正在掃描最新市場，舊正式訊號已暫停使用。':report.runtime_status==='STALE'?'資料已過期，禁止依此進場。':'最新掃描異常，目前沒有可使用的正式訊號。')}
      else renderSignals(report.signals||[]);
      renderWatchlist(report.watchlist||[]);renderMap(report.market_map||[],$('#mapSearch').value);
    }

    function directionBadge(item){const dir=item.direction||'NEUTRAL';return `<span class="badge ${dir==='LONG'?'long-b':dir==='SHORT'?'short-b':'watch-b'}">${dir==='LONG'?'🟢 ':dir==='SHORT'?'🔴 ':''}${esc(directionName[dir]||'中性')}</span>`}
    function stageBadge(item){const stage=item.signal_stage||item.status||'WATCH';let cls='watch-b';if(stage==='EARLY'||stage==='EARLY_SIGNAL')cls='early-b';else if(stage==='CONFIRMED')cls=item.direction==='LONG'?'confirmed-long':'confirmed-short';else if(stage==='NEAR_TRIGGER')cls='near-b';return `<span class="badge ${cls}">${esc(stageName[stage]||'觀望')}</span>`}
    function timeframeGrid(item){const frames=item.timeframe_states||{};return `<div class="tf-grid">${['4H','1H','15m','5m'].map(tf=>{const d=frames[tf]||{};return `<div class="tf"><b>${tf}</b><span>${esc(d.label||'資料未知')}</span></div>`}).join('')}</div>`}
    function groupRows(item){const groups=item.evidence_groups||{};const order=['position_structure','trend_momentum','participation_flow'];return `<div class="groups">${order.map(key=>{const g=groups[key]||{};const score=Math.max(0,Math.min(100,Number(g.score)||0));const cls=score>=60?'support':score<40?'conflict':'';return `<div class="group-row"><span>${esc(g.label||({position_structure:'位置／結構',trend_momentum:'趨勢／動能',participation_flow:'市場參與'}[key]))}</span><span class="bar"><i class="${cls}" style="width:${score}%"></i></span><b>${num(score,0)}</b></div>`}).join('')}</div>`}
    function list(items,empty){return `<ul>${(items&&items.length?items:[empty]).slice(0,6).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
    function safetyItems(item){return (item.safety_checks||[]).map(x=>`${x.passed?'✓':'✕'} ${x.label}${x.value!==null&&x.value!==undefined?`：${num(x.value,2)}`:''}`)}
    function details(item){const m=item.market_metrics||{};return `<details><summary>查看詳細分析</summary><div class="detail-grid">
      <div class="detail"><b>策略／市場型態</b>${esc(item.strategy||item.preferred_strategy)} · ${esc(regimeName[item.regime]||item.regime)}</div>
      <div class="detail"><b>進場品質</b>${esc(item.entry_quality?.label)} · ${num(item.entry_quality?.extension_atr,2)} ATR</div>
      ${item.entry_low?`<div class="detail"><b>進場區</b>${esc(item.entry_low)} ～ ${esc(item.entry_high)}</div><div class="detail"><b>止損／風報</b>${esc(item.stop_loss)} · ${num(item.risk_reward,2)}R</div><div class="detail"><b>TP1／TP2</b>${esc(item.take_profit_1)}／${esc(item.take_profit_2)}</div><div class="detail"><b>失效條件</b>${esc(item.invalidation)}</div>`:''}
      <div class="detail"><b>成交／資金流</b>15m 量比 ${num(m.volume_ratio_15m,2)} · 5m 量比 ${num(m.volume_ratio_5m,2)} · Taker Buy ${num(m.taker_buy_pct,1)}%</div>
      <div class="detail"><b>OI／Funding</b>OI ${num(m.open_interest_usd,0)} USD · 變化 ${num(m.open_interest_change_pct,2)}% · Funding ${num(m.funding_rate_pct,5)}%</div>
      <div class="detail"><b>Order Book</b>失衡 ${num(m.order_book_imbalance_pct,1)}% · Bid 深度 ${num(m.bid_depth_usd,0)} · Ask 深度 ${num(m.ask_depth_usd,0)}</div>
      <div class="detail"><b>Execution Cost</b>來回 ${num(m.estimated_round_trip_cost_pct,4)}% · 占原始風險 ${num(m.execution_cost_to_risk_pct,1)}%</div>
      <div class="detail" style="grid-column:1/-1"><b>原始指標</b><pre class="raw">${esc(JSON.stringify(m.raw_indicators||{},null,2))}</pre></div>
    </div></details>`}

    function renderSignals(items){const box=$('#signalsBox');if(!items.length){box.innerHTML='<div class="empty">本輪沒有通過證據融合與全部安全底線的正式進場訊號。系統不會為湊滿 20 個而放寬品質。</div>';return}box.innerHTML=items.map((item,index)=>`<article class="signal-card ${item.direction==='LONG'?'long':'short'}"><div class="card-head"><div><div class="symbol">${index+1}. ${esc(item.inst_id)}</div><div class="badges">${directionBadge(item)}${stageBadge(item)}</div></div><div class="score">${num(item.readiness_score??item.score,0)}<small>%</small></div></div>${timeframeGrid(item)}<p class="human">${esc(item.summary||'多時間框架與市場參與證據已完成融合。')}</p>${groupRows(item)}<div class="triage"><div class="bucket support"><h3>支持證據</h3>${list(item.supporting_evidence,'目前沒有額外支持')}</div><div class="bucket conflict"><h3>衝突／風險</h3>${list(item.conflicts,'沒有重大反向證據')}${item.neutral_evidence?.length?`<h4>中性／未額外支持（不是反向）</h4><ul class="neutral">${item.neutral_evidence.slice(0,3).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div><div class="bucket safety"><h3>安全底線</h3>${list(safetyItems(item),'安全資料待確認')}</div></div>${details(item)}</article>`).join('')}
    function renderWatchlist(items){const box=$('#watchBox');const filtered=items.filter(x=>x.direction!=='NEUTRAL');if(!filtered.length){box.innerHTML='<div class="empty">目前沒有接近觸發候選。</div>';return}box.innerHTML=filtered.map(item=>`<article class="watch-card"><div class="card-head"><div><div class="symbol">${esc(item.inst_id)}</div><div class="badges">${directionBadge(item)}${stageBadge(item)}</div></div><div class="score">${num(item.readiness_score,0)}<small>%</small></div></div>${timeframeGrid(item)}<p class="human">${esc(item.summary||'Setup 尚在形成，不能直接當作進場訊號。')}</p>${groupRows(item)}${details(item)}</article>`).join('')}
    function renderMap(items,query=''){const q=String(query||'').trim().toUpperCase();const rows=items.filter(x=>!q||String(x.inst_id).includes(q));const box=$('#mapBox');if(!rows.length){box.innerHTML='<div class="empty">找不到符合的市場。</div>';return}box.innerHTML=rows.map(item=>`<article class="map-card"><div><strong>${esc(item.inst_id)}</strong><div class="map-meta">${esc(regimeName[item.regime]||item.regime)} · ${esc(stageName[item.status]||'觀望')} · 準備度 ${num(item.readiness_score,0)}%</div></div>${directionBadge(item)}</article>`).join('')}

    async function loadReport(){try{const report=await api('/api/report/latest');renderReport(report)}catch(error){if(error.status!==404)throw error}}
    async function refreshStatus(){const status=await api('/api/status');renderStatus(status);return status}
    async function startScan(){
      $('#scanButton').disabled=true;$('#scanButton').textContent='掃描中…';
      $('#scanNotice').classList.add('show');$('#scanMessage').textContent='正在取得最新市場資料';renderUnavailable('正在掃描最新市場，舊正式訊號已暫停使用。');
      try{await api('/api/scan',{method:'POST'});await pollUntilComplete()}catch(error){showConnectionError(error)}
    }
    async function pollUntilComplete(){if(state.polling)return;state.polling=true;let failures=0;try{for(let count=0;count<360;count++){try{const status=await refreshStatus();failures=0;if(status.system_status!=='SCANNING'){await loadReport();return}}catch(error){failures++;if(failures>=5)throw error}await new Promise(resolve=>setTimeout(resolve,2000))}throw new Error('掃描等待超過 12 分鐘，已停止輪詢。')}finally{state.polling=false;const s=state.status||{};$('#scanButton').disabled=s.system_status==='SCANNING';$('#scanButton').textContent=s.system_status==='SCANNING'?'掃描中…':'立即掃描現在市場'}}
    function showConnectionError(error){const danger=$('#dangerNotice');danger.textContent=`無法連接雷達服務：${error.message||error}`;danger.classList.add('show');$('#statusPill').textContent='掃描異常';$('#statusPill').className='status-pill error';$('#scanButton').disabled=false;$('#scanButton').textContent='再次掃描現在市場'}
    async function bootstrap(){try{await refreshStatus();if(!state.autoStarted){state.autoStarted=true;await startScan()}}catch(error){showConnectionError(error)}}
    async function refreshFreshness(){try{if(!state.polling){const status=await refreshStatus();if(status.system_status==='STALE'||status.system_status==='ERROR')await loadReport()}}catch(error){showConnectionError(error)}finally{setTimeout(refreshFreshness,60000)}}

    $$('.tab').forEach(button=>button.addEventListener('click',()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===button));$$('.section').forEach(x=>x.classList.toggle('active',x.id===button.dataset.tab))}));
    $('#scanButton').addEventListener('click',startScan);
    $('#mapSearch').addEventListener('input',event=>renderMap(state.report?.market_map||[],event.target.value));
    bootstrap();setTimeout(refreshFreshness,60000);
  </script>
</body>
</html>
